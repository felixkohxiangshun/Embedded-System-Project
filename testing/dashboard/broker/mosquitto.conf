# Stage 1: laptop-only development broker. No car commands or credentials.
# Bind to loopback until the Pico WiFi bring-up is configured explicitly.
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Firmware-style MQTT clients, tested locally first.
listener 1883 127.0.0.1
protocol mqtt

# Browser dashboard transport. This is not a webpage server.
listener 9001 127.0.0.1
protocol websockets
